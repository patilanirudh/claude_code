services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: riskpulse
      POSTGRES_PASSWORD: riskpulse
      POSTGRES_DB: riskpulse
    ports:
      - "55432:5432"  # non-default host port -- 5432 is often already taken
                       # by a system postgres on shared/templated VMs. The
                       # backend talks to this over the Docker network as
                       # postgres:5432 regardless; this port is only for an
                       # external client (psql, a GUI tool) on the host.
    volumes:
      - riskpulse_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riskpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"  # same reasoning as postgres above
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://riskpulse:riskpulse@postgres:5432/riskpulse
      REDIS_URL: redis://redis:6379/0
      # Container runs as root (no USER in the Dockerfile) and backend/app/
      # is bind-mounted -- without this, Python's __pycache__/*.pyc files
      # get written to the host owned by root, which a non-root VM user
      # then can't delete via a normal file manager. Just skip writing them.
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_GRAPHQL_URL: http://localhost:8000/graphql
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      - backend

volumes:
  riskpulse_pg:
